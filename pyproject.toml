[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли фиатными и криптовалютами"
readme = "README.md"
authors = [
    { name = "Fayzulin" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.8.0,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
exchange_rates_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
starting_balance = 10000.0
log_dir = "logs"
actions_log_file = "logs/actions.log"
parser_log_file = "logs/parser.log"
log_level = "INFO"
